<!DOCTYPE html>
<html lang="ru" class="scroll-smooth bg-[#050505]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flawless Private</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Пульсация */
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }
    .animate-pulse-slow { animation: pulse-slow 2s infinite ease-in-out; }

    /* Премиальная анимация появления при скролле */
    .reveal {
      opacity: 0;
      transform: translateY(50px) scale(0.9);
      transition: all 0.9s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .delay-100 { transition-delay: 100ms; }
    .delay-200 { transition-delay: 200ms; }
    .delay-300 { transition-delay: 300ms; }

    /* Парящие стикеры */
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .sticker-float {
      animation: float 4s ease-in-out infinite;
    }

    /* Анимация Toast-уведомлений (Покупки) */
    .toast-enter {
      transform: translateX(-100%) scale(0.9);
      opacity: 0;
    }
    .toast-active {
      transform: translateX(0) scale(1);
      opacity: 1;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast-leave {
      transform: translateX(-100%) scale(0.9);
      opacity: 0;
      transition: all 0.4s ease-in;
    }

    /* Светящийся текст */
    .neon-brand-title {
      background: linear-gradient(135deg, #ffffff 20%, #c084fc 60%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(139, 92, 246, 0.4));
    }

    /* Живой фон */
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 15s infinite alternate ease-in-out; }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }

    /* Наклон карточек при наведении */
    .card-hover:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 20px 40px -10px rgba(139, 92, 246, 0.15);
    }
  </style>
</head>
